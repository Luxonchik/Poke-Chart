version: '3.8'

services:
  # База данных
  db:
    image: postgres:15-alpine
    container_name: pokecart_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=pokecart
    ports:
      - "5432:5432" # Прокидываем порт, чтобы ты мог подключиться через DBeaver или PGAdmin
    volumes:
      - db_data:/var/lib/postgresql/data
      # Сюда положим SQL скрипт, чтобы таблицы создались сами при старте
      - ./shared/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: