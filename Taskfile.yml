version: "3"

tasks:
  db:
    cmds:
      - docker compose up -d --wait db

  api:
    dir: services/api
    deps: [db]
    cmds:
      - go run cmd/api/main.go

  scraper:
    dir: services/scraper-carrot
    cmds:
      - go run cmd/main.go

  web:
    dir: web
    cmds:
      - npm run dev -- -p 4000

  # Запустить всё сразу параллельно
  default:
    deps: [api, web]
